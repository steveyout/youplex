name: Build Android TV APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate Dummy Keystore
        run: |
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Youplex, OU=TV, O=Youplex, L=Unknown, ST=Unknown, C=US"

      - name: Locate Android SDK and Configure Bubblewrap
        run: |
          # Find the actual SDK path on the runner
          REAL_ANDROID_SDK=$(dirname $(dirname $(find /usr/local/lib/android/sdk -name "adb" | head -n 1)))
          if [ -z "$REAL_ANDROID_SDK" ]; then REAL_ANDROID_SDK=$ANDROID_HOME; fi
          
          echo "Found Android SDK at: $REAL_ANDROID_SDK"
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "$REAL_ANDROID_SDK"
          }
          EOF

      - name: Build APK with Bubblewrap
        run: |
          # Use yes to bypass any remaining license prompts
          yes | bubblewrap build --quiet --skipActionablePreviews

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ./*.apk
